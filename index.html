                                                                {h100 > 0 && <div style={{height: `${h100}%`}} className="w-full bg-[#10b981] transition-all border-b border-white/20"></div>}
                                                                {h75 > 0 && <div style={{height: `${h75}%`}} className="w-full bg-[#0d9488] transition-all border-b border-white/20"></div>}
                                                                {h50 > 0 && <div style={{height: `${h50}%`}} className="w-full bg-amber-400 transition-all border-b border-white/20"></div>}
                                                                {h25 > 0 && <div style={{height: `${h25}%`}} className="w-full bg-rose-500 transition-all"></div>}
                                                            </div>
                                                            <div className="mt-3 text-[10px] font-black text-slate-600 text-center w-full px-1 truncate leading-tight" title={stat.dir}>{stat.dir}</div>
                                                            <div className="text-[9px] text-slate-400 font-bold">{stat.headcount} Org</div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            
                                            <div className="mt-6 flex flex-wrap gap-5 text-[11px] font-black text-slate-500 border-t-2 border-slate-100 pt-6">

                                                <div className="flex items-center"><span className="w-3.5 h-3.5 bg-[#0d9488] rounded-md mr-2 shadow-sm"></span> Cukup (51-75%)</div>
                                                <div className="flex items-center"><span className="w-3.5 h-3.5 bg-amber-400 rounded-md mr-2 shadow-sm"></span> Buruk (26-50%)</div>
                                                <div className="flex items-center"><span className="w-3.5 h-3.5 bg-rose-500 rounded-md mr-2 shadow-sm"></span> Kritis (0-25%)</div>
                                            </div>
                                        </div>
                                        
                                        <div className="md:w-1/3 bg-[#f8fafc] rounded-[2rem] p-7 border border-slate-200 h-96 overflow-y-auto shadow-inner relative">
                                            {hoveredDir ? (
                                                <div className="flex flex-col">
                                                    <h4 className="font-black text-[#0b2136] text-xl mb-1">{hoveredDir.dir}</h4>
                                                    <p className="text-xs text-slate-500 mb-6 font-bold border-b-2 border-slate-200 pb-4">{hoveredDir.headcount} Karyawan Terdaftar</p>
                                                    
                                                    <div className="space-y-5">
                                                        <div>
                                                            <h5 className="text-[10px] font-black uppercase text-slate-400 mb-3 tracking-widest">Analisis Isu & Peristiwa</h5>
                                                            <ul className="text-xs space-y-2.5 font-bold text-[#0b2136]">
                                                                <li className="flex justify-between bg-white border border-slate-200 p-3 rounded-xl shadow-sm"><span>Total Hari Cuti:</span> <span className="text-[#0f766e]">{hoveredDir.issues.leaves}</span></li>
                                                                <li className="flex justify-between bg-white border border-slate-200 p-3 rounded-xl shadow-sm"><span>Hari Bolos / Tidak Absen:</span> <span className="text-rose-600">{hoveredDir.issues.absents}</span></li>
                                                                <li className="flex justify-between bg-white border border-slate-200 p-3 rounded-xl shadow-sm"><span>Lupa Absen Keluar (Out):</span> <span className="text-amber-600">{hoveredDir.issues.missingOut}</span></li>
                                                            </ul>
                                                        </div>
                                                        {hoveredDir.buckets['0-25'].length > 0 && (
                                                            <div className="pt-2">
                                                                <h5 className="text-[10px] font-black uppercase text-rose-500 mb-3 tracking-widest">Peringatan Kritis (0-25%)</h5>
                                                                <div className="bg-rose-50 rounded-xl p-4 border border-rose-100 max-h-32 overflow-y-auto">
                                                                    <ul className="text-[11px] font-bold text-rose-800 space-y-2">
                                                                        {hoveredDir.buckets['0-25'].map((emp, i) => <li key={i} className="flex items-center"><div className="w-1.5 h-1.5 rounded-full bg-rose-500 mr-2"></div> {emp.name}</li>)}
                                                                    </ul>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="h-full flex flex-col items-center justify-center text-center text-slate-400">
                                                    <div className="bg-white p-4 rounded-full shadow-sm mb-4 border border-slate-100">
                                                        <svg className="w-8 h-8 text-[#0f766e]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                                    </div>
                                                    <p className="text-[13px] font-bold px-4 leading-relaxed">Arahkan kursor ke diagram batang di samping untuk melihat rincian.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB: LAPORAN INDIVIDU */}
                        {activeTab === 'report' && currentEmployeeData && (
                            <div className="space-y-4">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 flex flex-col sm:flex-row justify-between items-center gap-4 no-print">
                                    <div className="flex items-center w-full sm:w-auto">
                                        <label className="mr-4 text-[13px] font-black text-[#0b2136] uppercase tracking-wider">Pilih Karyawan:</label>
                                        <select value={selectedEmployee} onChange={(e) => setSelectedEmployee(e.target.value)} className="w-full sm:w-80 border border-slate-300 bg-white rounded-xl p-3 font-bold text-[#0f766e] focus:border-[#0f766e] outline-none transition shadow-sm">
                                            {processedData.map((emp, idx) => <option key={idx} value={emp.empKey}>{emp.name}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={() => downloadPDF('print-individu', `Report_${currentEmployeeData.name.replace(/\s+/g, '_')}`)} disabled={isGeneratingPDF} className={`${isGeneratingPDF ? 'bg-slate-400' : 'bg-[#0f766e] hover:bg-[#0d6059] hover:shadow-lg'} text-white px-6 py-3.5 rounded-xl font-black shadow-md flex items-center transition-all text-sm tracking-wide`}>
                                        {isGeneratingPDF ? 'Menyiapkan PDF...' : <><IconPrint className="mr-2 w-4 h-4" /> Download / Cetak PDF</>}
                                    </button>
                                </div>

                                <div id="print-individu" className="bg-white p-10 rounded-3xl shadow-sm border border-slate-200/60 print-container">
                                    <div className="border-b-[4px] border-[#021326] pb-6 mb-8 flex justify-between items-end">
                                        <div>
                                            <h1 className="text-3xl font-black text-[#021326] tracking-tight">Laporan Individu</h1>
                                            <p className="text-slate-500 font-bold text-[13px] mt-1.5">Data Gabungan Mesin, Manual, & Cuti</p>
                                            <p className="text-[13px] font-black text-[#0f766e] mt-3">Periode: {getReportPeriodStr()}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-2xl font-black text-[#021326]">{currentEmployeeData.name}</p>
                                            <p className="text-[11px] font-black text-slate-500 uppercase tracking-widest mt-1.5">{currentEmployeeData.dept}</p>
                                        </div>
                                    </div>

                                    {/* Mini Summary Cards */}
                                    <div className="grid grid-cols-4 gap-5 mb-10">
                                        <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200 shadow-sm border-l-[6px] border-l-[#021326]">
                                            <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1.5">Kehadiran Aktual</p>
                                            <p className="text-2xl font-black text-[#021326]">{currentEmployeeData.summary.totalDays} HARI</p>
                                        </div>
                                        <div className="bg-emerald-50 rounded-2xl p-5 border border-emerald-100 shadow-sm border-l-[6px] border-l-[#10b981]">
                                            <p className="text-[10px] font-black uppercase text-[#0f766e] tracking-widest mb-1.5">Cuti / Izin Sah</p>
                                            <p className="text-2xl font-black text-[#0f766e]">{currentEmployeeData.summary.leaveDays} HARI</p>
                                        </div>
                                        <div className="bg-rose-50 rounded-2xl p-5 border border-rose-100 shadow-sm border-l-[6px] border-l-rose-500">
                                            <p className="text-[10px] font-black uppercase text-rose-500 tracking-widest mb-1.5">Lupa Absen Keluar</p>
                                            <p className="text-2xl font-black text-rose-600">{currentEmployeeData.summary.missingOuts} KALI</p>
                                        </div>
                                        <div className="bg-amber-50 rounded-2xl p-5 border border-amber-100 shadow-sm border-l-[6px] border-l-amber-400">
                                            <p className="text-[10px] font-black uppercase text-amber-600 tracking-widest mb-1.5">Aktivitas Ganda</p>
                                            <p className="text-2xl font-black text-amber-600">{currentEmployeeData.summary.duplicates} KALI</p>
                                        </div>
                                    </div>

                                    <table className="min-w-full border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                        <thead className="bg-[#f8fafc] border-b-2 border-slate-200">
                                            <tr>
                                                <th className="px-6 py-4 text-left text-[11px] font-black text-[#0b2136] uppercase tracking-widest border-r border-slate-200">Tanggal</th>
                                                <th className="px-6 py-4 text-center text-[11px] font-black text-[#0b2136] uppercase tracking-widest border-r border-slate-200">Jam Masuk (In)</th>
                                                <th className="px-6 py-4 text-center text-[11px] font-black text-[#0b2136] uppercase tracking-widest border-r border-slate-200">Jam Keluar (Out)</th>
                                                <th className="px-6 py-4 text-left text-[11px] font-black text-[#0b2136] uppercase tracking-widest">Keterangan / Sumber</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y divide-slate-100">
                                            {currentEmployeeData.days.map((day, idx) => {
                                                const isLeave = !!day.leaveType;
                                                const isAbsent = !day.in && !day.out && !isLeave;
                                                return (
                                                    <tr key={idx} className={`${isLeave ? 'bg-emerald-50/40' : ''} ${day.missingOut || day.missingIn ? 'bg-rose-50/40' : ''} ${isAbsent ? 'bg-slate-50' : ''} hover:bg-slate-50 transition-colors`}>
                                                        <td className="px-6 py-4 whitespace-nowrap text-[13px] font-bold text-[#0b2136] border-r border-slate-100">{formatDate(day.dateObj)}</td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-center border-r border-slate-100">
                                                            {isLeave || isAbsent ? '-' : <span className="font-bold text-[#0b2136]">{formatTime(day.in)}</span>}
                                                            {day.sourceIn === 'timesheet' && <span className="ml-2 px-1.5 py-0.5 bg-[#e0f2fe] text-[#0284c7] text-[10px] font-black rounded shadow-sm">TS</span>}
                                                        </td>
                                                        <td className={`px-6 py-4 whitespace-nowrap text-sm text-center border-r border-slate-100 ${day.missingOut ? 'text-rose-600 font-black' : ''}`}>
                                                            {isLeave || isAbsent ? '-' : day.missingOut ? 'LUPA OUT' : <span className="font-bold text-[#0b2136]">{formatTime(day.out)}</span>}
                                                            {day.sourceOut === 'timesheet' && <span className="ml-2 px-1.5 py-0.5 bg-[#e0f2fe] text-[#0284c7] text-[10px] font-black rounded shadow-sm">TS</span>}
                                                        </td>
                                                        <td className="px-6 py-4 text-xs font-bold">
                                                            {isLeave && <span className="text-[#059669] uppercase tracking-wider flex items-center"><IconCheck className="w-4 h-4 mr-1.5"/> CUTI / SAKIT: {day.leaveType}</span>}
                                                            {isAbsent && <span className="text-slate-400 font-semibold">- Tidak ada keterangan</span>}
                                                            {day.missingOut && <span className="text-rose-500 block">- Lupa absen saat pulang</span>}
                                                            {day.sourceIn === 'timesheet' || day.sourceOut === 'timesheet' ? <span className="text-[#0284c7] block">- Data ditambal manual dari Timesheet</span> : null}
                                                            {day.rawInType && !/^(in|clock in|check in|masuk|clock-in|check-in)$/i.test(day.rawInType) && <span className="text-slate-500 block">- In: {day.rawInType}</span>}
                                                            {day.rawOutType && !/^(out|clock out|check out|keluar|clock-out|check-out)$/i.test(day.rawOutType) && <span className="text-slate-500 block">- Out: {day.rawOutType}</span>}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB: LAPORAN DIREKTORAT */}
                        {activeTab === 'dir-report' && rawMasterData.length > 0 && selectedDirReport && (
                            <div className="space-y-4">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 flex flex-col sm:flex-row justify-between items-center gap-4 no-print">
                                    <div className="flex items-center w-full sm:w-auto">
                                        <label className="mr-4 text-[13px] font-black text-[#0b2136] uppercase tracking-wider">Pilih Direktorat:</label>
                                        <select value={selectedDirReport} onChange={(e) => setSelectedDirReport(e.target.value)} className="w-full sm:w-80 border border-slate-300 bg-white rounded-xl p-3 font-bold text-[#0f766e] focus:border-[#0f766e] outline-none transition shadow-sm">
                                            {Object.keys(directorateStats).sort().map((dir, idx) => <option key={idx} value={dir}>{dir}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={() => downloadPDF('print-direktorat', `Report_Direktorat_${selectedDirReport.replace(/\s+/g, '_')}`)} disabled={isGeneratingPDF} className={`${isGeneratingPDF ? 'bg-slate-400' : 'bg-[#0f766e] hover:bg-[#0d6059] hover:shadow-lg'} text-white px-6 py-3.5 rounded-xl font-black shadow-md flex items-center transition-all text-sm tracking-wide`}>
                                        {isGeneratingPDF ? 'Membuat PDF...' : <><IconPrint className="mr-2 h-4 w-4" /> Cetak PDF (Summary + Individu)</>}
                                    </button>
                                </div>

                                <div id="print-direktorat" className="print-container">
                                    <div className="bg-white p-10 rounded-3xl shadow-sm border border-slate-200/60 mb-8 page-break html2pdf__page-break">
                                        <div className="border-b-[4px] border-[#021326] pb-6 mb-8">
                                            <h1 className="text-3xl font-black text-[#021326] tracking-tight">Laporan Eksekutif Direktorat</h1>
                                            <p className="text-slate-500 font-bold text-[13px] mt-1.5">Analisis Kehadiran & Data Terpadu</p>
                                        </div>
                                        <div className="mb-8"><h2 className="text-2xl font-black text-[#0f766e] mb-1">{selectedDirReport}</h2></div>
                                        <table className="min-w-full border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                            <thead className="bg-[#f8fafc] border-b-2 border-slate-200">
                                                <tr>
                                                    <th className="px-6 py-4 text-left text-[11px] font-black text-[#0b2136] uppercase tracking-widest border-r border-slate-200">Nama Karyawan</th>
                                                    <th className="px-6 py-4 text-center text-[11px] font-black text-[#0b2136] uppercase tracking-widest border-r border-slate-200">Kehadiran Aktual</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-slate-100">
                                                {processedData.filter(emp => emp.dept === selectedDirReport).map((emp, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="px-6 py-4 text-[13px] text-[#0b2136] font-bold border-r border-slate-100">{emp.name}</td>
                                                        <td className="px-6 py-4 text-sm text-[#0f766e] font-black text-center border-r border-slate-100">{emp.summary.totalDays} HARI</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    {processedData.filter(emp => emp.dept === selectedDirReport).map((empData, eIdx) => (
                                        <div key={`print-emp-${eIdx}`} className="bg-white p-10 rounded-3xl shadow-sm border border-slate-200 mb-8 page-break html2pdf__page-break">
                                            <div className="border-b-[3px] border-[#021326] pb-5 mb-8 flex justify-between items-end">
                                                <div>
                                                    <h1 className="text-2xl font-black text-[#021326]">Laporan Individu</h1>
                                                    <p className="text-[13px] font-black text-[#0f766e] mt-1.5">Periode: {getReportPeriodStr()}</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-xl font-black text-[#021326]">{empData.name}</p>
                                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mt-1">{empData.dept}</p>
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-4 gap-4 mb-6">
                                                <div className="bg-slate-50 rounded-xl p-4 border border-slate-200"><p className="text-[9px] font-black uppercase text-slate-400 tracking-wider">Kehadiran Aktual</p><p className="text-xl font-black text-[#021326] mt-1">{empData.summary.totalDays}</p></div>
                                                <div className="bg-emerald-50 rounded-xl p-4 border border-emerald-100"><p className="text-[9px] font-black uppercase text-[#0f766e] tracking-wider">Cuti/Izin</p><p className="text-xl font-black text-[#0f766e] mt-1">{empData.summary.leaveDays}</p></div>
                                                <div className="bg-rose-50 rounded-xl p-4 border border-rose-100"><p className="text-[9px] font-black uppercase text-rose-500 tracking-wider">Lupa Out</p><p className="text-xl font-black text-rose-600 mt-1">{empData.summary.missingOuts}</p></div>
                                                <div className="bg-amber-50 rounded-xl p-4 border border-amber-100"><p className="text-[9px] font-black uppercase text-amber-600 tracking-wider">Aktivitas Ganda</p><p className="text-xl font-black text-amber-600 mt-1">{empData.summary.duplicates}</p></div>
                                            </div>

                                            <table className="min-w-full border border-slate-200 rounded-lg overflow-hidden">
                                                <thead className="bg-[#f8fafc] border-b-2 border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-3 text-left text-[10px] font-black text-[#0b2136] uppercase tracking-wider border-r border-slate-200">Tanggal</th>
                                                        <th className="px-4 py-3 text-center text-[10px] font-black text-[#0b2136] uppercase tracking-wider border-r border-slate-200">Masuk (In)</th>
                                                        <th className="px-4 py-3 text-center text-[10px] font-black text-[#0b2136] uppercase tracking-wider border-r border-slate-200">Keluar (Out)</th>
                                                        <th className="px-4 py-3 text-left text-[10px] font-black text-[#0b2136] uppercase tracking-wider">Keterangan</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 text-xs font-bold">
                                                    {empData.days.map((day, idx) => {
                                                        const isLeave = !!day.leaveType;
                                                        const isAbsent = !day.in && !day.out && !isLeave;
                                                        return (
                                                            <tr key={idx} className={`${isLeave ? 'bg-emerald-50/30' : ''} ${day.missingOut ? 'bg-rose-50/30' : ''} ${isAbsent ? 'text-slate-400 bg-slate-50/50' : 'text-[#0b2136]'}`}>
                                                                <td className="px-4 py-3 border-r border-slate-100">{formatDate(day.dateObj)}</td>
                                                                <td className="px-4 py-3 text-center border-r border-slate-100">{isLeave || isAbsent ? '-' : formatTime(day.in)} {day.sourceIn === 'timesheet' && '(TS)'}</td>
                                                                <td className={`px-4 py-3 text-center border-r border-slate-100 ${day.missingOut ? 'text-rose-600 font-black' : ''}`}>{isLeave || isAbsent ? '-' : day.missingOut ? 'LUPA OUT' : formatTime(day.out)} {day.sourceOut === 'timesheet' && '(TS)'}</td>
                                                                <td className="px-4 py-3 text-[10px]">
                                                                    {isLeave && <span className="text-[#059669]">CUTI: {day.leaveType}</span>}
                                                                    {isAbsent && <span className="font-semibold">- Tidak ada keterangan</span>}
                                                                    {day.missingOut && <span className="text-rose-500">- Lupa absen pulang</span>}
                                                                    {(day.sourceIn === 'timesheet' || day.sourceOut === 'timesheet') && <span className="text-[#0284c7]">- Ditambal Timesheet</span>}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {/* TAB: TIDAK HADIR */}
                        {activeTab === 'absent' && rawMasterData.length > 0 && (
                            <div className="space-y-6">
                                <div className="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-slate-200/60">
                                    <div className="border-b-[4px] border-[#021326] pb-5 mb-8">
                                        <h1 className="text-2xl md:text-3xl font-black text-[#021326] tracking-tight">Laporan Tidak Hadir Harian</h1>
                                        <p className="text-[13px] text-slate-500 font-bold mt-2">Daftar Karyawan di Master Database yang tidak memiliki rekam jejak mesin/timesheet dan tidak sedang cuti.</p>
                                    </div>
                                    
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center mb-8 bg-[#f8fafc] p-5 rounded-2xl border border-slate-200 shadow-inner">
                                        <label className="mr-4 text-[13px] font-black text-[#0b2136] uppercase tracking-wider mb-2 sm:mb-0">Pilih Tanggal Laporan:</label>
                                        <select value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="w-full sm:w-64 border border-slate-300 bg-white rounded-xl p-3 font-bold text-[#0f766e] focus:ring-0 outline-none focus:border-[#0f766e] shadow-sm">
                                            {Array.from(new Set(targetDates || [])).sort().reverse().map((dateStr, idx) => (
                                                <option key={idx} value={dateStr}>{new Date(dateStr).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' })}</option>
                                            ))}
                                        </select>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {absenteeStatsByDept.map((deptStat, idx) => (
                                            <div key={idx} className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition">
                                                <div className="bg-[#f8fafc] px-5 py-4 border-b border-slate-200">
                                                    <h3 className="font-black text-[#0b2136] text-[15px] truncate" title={deptStat.dept}>{deptStat.dept}</h3>
                                                    <div className="flex justify-between items-center mt-2">
                                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">TIDAK HADIR: <span className="text-rose-600 text-[13px] ml-1">{deptStat.count}</span></span>
                                                        <span className="text-[10px] font-bold text-slate-500 bg-slate-200 px-2 py-0.5 rounded-md">Total: {deptStat.totalEmployees} Org</span>
                                                    </div>
                                                </div>
                                                <ul className="divide-y divide-slate-100 max-h-56 overflow-y-auto">
                                                    {deptStat.employees.map((emp, empIdx) => (
                                                        <li key={empIdx} className="px-5 py-3.5 text-[12px] font-bold text-[#0b2136] hover:bg-slate-50 flex items-center transition-colors">
                                                            <div className="w-2 h-2 rounded-full bg-rose-400 mr-3 shadow-sm"></div> {emp.name}
                                                        </li>
                                                    ))}
                                                    {deptStat.count === 0 && (
                                                        <li className="px-5 py-8 text-xs text-center text-[#0f766e] font-black bg-emerald-50/50">Lengkap! Semua Hadir/Cuti.</li>
                                                    )}
                                                </ul>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* TAB: ANOMALI */}
                        {activeTab === 'anomalies' && dashboardStats && (
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200/60 overflow-hidden">
                                <div className="px-8 py-6 border-b border-slate-200 bg-[#f8fafc]">
                                    <h3 className="font-black text-[#021326] text-2xl tracking-tight">Catatan Anomali</h3>
                                    <p className="text-xs text-slate-500 font-bold mt-1.5">Daftar absensi ganda atau lupa check-out.</p>
                                </div>
                                <div className="p-0 overflow-x-auto">
                                    <table className="min-w-full">
                                        <thead className="bg-white border-b-2 border-slate-200">
                                            <tr>
                                                <th className="px-8 py-4 text-left text-[11px] font-black text-slate-400 uppercase tracking-widest">Tanggal</th>
                                                <th className="px-8 py-4 text-left text-[11px] font-black text-slate-400 uppercase tracking-widest">Karyawan</th>
                                                <th className="px-8 py-4 text-left text-[11px] font-black text-slate-400 uppercase tracking-widest">Isu / Anomali</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 bg-white">
                                            {dashboardStats.anomaliesList.map((anom, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-8 py-5 whitespace-nowrap text-[13px] font-bold text-[#0b2136]">{formatDate(anom.date)}</td>
                                                    <td className="px-8 py-5 whitespace-nowrap">
                                                        <p className="text-[14px] font-black text-[#0b2136]">{anom.name}</p>
                                                        <p className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-0.5">{anom.dept}</p>
                                                    </td>
                                                    <td className="px-8 py-5 text-xs font-bold">
                                                        {anom.missingOut && <span className="inline-flex items-center px-3 py-1.5 rounded-lg text-amber-700 bg-amber-50 mr-2 mb-2 border border-amber-200 shadow-sm"><IconWarning className="w-3.5 h-3.5 mr-1.5"/> Lupa Absen Keluar</span>}
                                                        {anom.missingIn && <span className="inline-flex items-center px-3 py-1.5 rounded-lg text-rose-700 bg-rose-50 mr-2 mb-2 border border-rose-200 shadow-sm"><IconWarning className="w-3.5 h-3.5 mr-1.5"/> Lupa Absen Masuk</span>}
                                                        {anom.isDuplicate && <span className="inline-flex items-center px-3 py-1.5 rounded-lg text-[#0f766e] bg-teal-50 mr-2 mb-2 border border-teal-200 shadow-sm"><IconAlert className="w-3.5 h-3.5 mr-1.5"/> Aktivitas In/Out Ganda</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                            {dashboardStats.anomaliesList.length === 0 && (
                                                <tr><td colSpan="3" className="px-8 py-16 text-center text-sm font-bold text-slate-400">Tidak ada anomali yang ditemukan.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
