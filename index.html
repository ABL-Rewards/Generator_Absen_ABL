                                                <td className="p-3 text-right font-medium text-slate-600">{formatRupiah(peer.basic)}</td>
                                                <td className="p-3 text-right font-medium text-slate-600">{formatRupiah(peer.incentive)}</td>
                                                <td className="p-3 text-right font-bold text-amber-700">{formatRupiah(peer.basic + peer.incentive)}</td>
                                                <td className="p-3 text-right text-xs text-slate-500 flex flex-col items-end gap-1">
                                                    {peer.meal > 0 && <span>Meal: {formatRupiah(peer.meal)}</span>}
                                                    {peer.other > 0 && <span>Other: {formatRupiah(peer.other)}</span>}
                                                    {peer.specialist > 0 && <span>Spec: {formatRupiah(peer.specialist)}</span>}
                                                    {peer.meal === 0 && peer.other === 0 && peer.specialist === 0 && <span>-</span>}
                                                </td>
                                            </tr>
                                        ))}
                                        {displayedPeers.length === 0 && (
                                            <tr>
                                                <td colSpan="5" className="p-4 text-center text-slate-500 italic">No peers found in database for this grade.</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* BENEFITS (CHECKLIST UNTUK OFFER LETTER) */}
                        <div className="bg-white rounded-2xl shadow-sm print-shadow-none p-6 border border-slate-200 border-t-4 border-t-emerald-500 print-break-inside-avoid">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-slate-800 flex items-center"><i className="fas fa-heart text-emerald-500 mr-2"></i>Proposed Benefits (Included in Offer Letter)</h2>
                                <span className="text-xs text-slate-400 font-medium italic">Checklist yang dicentang akan masuk ke Offering Letter</span>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {(dbBenefits[candidate.grade] || []).map((ben, idx) => {
                                    const isChecked = selectedBenefits.includes(ben);
                                    return (
                                        <label key={idx} className={`flex items-center text-sm font-medium p-3 rounded-xl border cursor-pointer transition ${isChecked ? 'bg-emerald-50/60 border-emerald-300 text-emerald-900 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                                            <input 
                                                type="checkbox" 
                                                checked={isChecked} 
                                                onChange={(e) => {
                                                    if (e.target.checked) {
                                                        setSelectedBenefits([...selectedBenefits, ben]);
                                                    } else {
                                                        setSelectedBenefits(selectedBenefits.filter(b => b !== ben));
                                                    }
                                                }}
                                                className="w-4 h-4 text-emerald-600 bg-white border-slate-300 rounded focus:ring-emerald-500 mr-3"
                                            />
                                            <span className="flex-1">{ben}</span>
                                        </label>
                                    );
                                })}
                                {(!dbBenefits[candidate.grade] || dbBenefits[candidate.grade].length === 0) && (
                                    <div className="col-span-2 text-slate-500 italic text-sm">No standard benefits defined for this level in database.</div>
                                )}
                            </div>
                        </div>

                        {/* APPROVALS */}
                        <div className="bg-white rounded-2xl shadow-sm print-shadow-none p-6 mt-8 border border-slate-200 print-break-inside-avoid">
                            <h3 className="text-md font-bold text-slate-800 mb-6 border-b pb-2">Approval Signatures</h3>
                            <div className="grid grid-cols-2 gap-10 text-center max-w-4xl mx-auto">
                                <div>
                                    <p className="text-sm font-semibold text-slate-500 mb-20 print:mb-12">Proposed By:</p>
                                    <div className="border-b-2 border-slate-400 mx-8"></div>
                                    <p className="text-sm font-bold text-slate-800 mt-2">Compensation & Benefit</p>
                                </div>
                                <div>
                                    <p className="text-sm font-semibold text-slate-500 mb-20 print:mb-12">Approved By:</p>
                                    <div className="border-b-2 border-slate-400 mx-8"></div>
                                    <p className="text-sm font-bold text-slate-800 mt-2">Compensation & Benefit Head</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="text-center pb-8 no-print text-slate-400 text-sm font-medium">
                            <p>CompensatePro &copy; 2026 - Enterprise Total Rewards System</p>
                        </div>
                        
                        </div> {/* Akhir Wrapper HIDE saat cetak Offer */}

                        {}
                        {/* ======================================================================
                            OFFERING LETTER TEMPLATE (HANYA MUNCUL SAAT KLIK 'PRINT OFFER')
                            ====================================================================== */}
                        <div className="hidden print-offer-only print:block w-full bg-white text-black font-sans leading-tight">
                            
                            {/* Header: Logo & Judul */}
                            <div className="flex justify-between items-end border-b border-black pb-1 mb-1">
                                <img src={LOGOS[entity]} alt="Company Logo" className="h-10 object-contain" onError={(e)=>e.target.style.display='none'} />
                                <div className="text-right">
                                    <h1 className="font-black uppercase tracking-wider">OFFERING LETTER</h1>
                                    <p className="text-[7pt] m-0">Ref: {entity}/OL/{new Date().getFullYear()}/{Math.floor(Math.random() * 8999 + 1000)}</p>
                                </div>
                            </div>
                            
                            <p className="mb-0.5 text-[8pt]">Dear Mr/Mrs <strong>{candidate.nickname || candidate.name || '________________'}</strong>,</p>
                            <p className="mb-1 text-[8pt]">We are pleased to offer you a position in <strong>{entity === 'ABL' ? 'PT Asian Bulk Logistics' : (entity === 'DCA' ? 'PT Dian Ciptamas Agung' : 'PT ABC')}</strong> with following terms and conditions:</p>
                            
                            {/* Tabel Offering - DIMAMPATKAN JADI 4 KOLOM DI ATAS */}
                            <table className="offer-table w-full mb-1">
                                <tbody>
                                    {/* Baris 1: Full Name */}
                                    <tr>
                                        <td className="w-[18%] font-semibold">Name</td>
                                        <td colSpan="3"><strong>{candidate.name || '-'}</strong></td>
                                    </tr>
                                    
                                    {/* Baris 2: Position & Level BERSEBELAHAN */}
                                    <tr>
                                        <td className="w-[18%] font-semibold">Position</td>
                                        <td className="w-[32%]">{candidate.position || '-'}</td>
                                        <td className="w-[15%] font-semibold">Level</td>
                                        <td className="w-[35%]">{candidate.grade.replace('Level ', '')}</td>
                                    </tr>
                                    
                                    {/* Baris 3: Point of Hire & Join Date BERSEBELAHAN */}
                                    <tr>
                                        <td className="font-semibold">Point of Hire</td>
                                        <td>Work Location: {candidate.pointOfHire || 'Jakarta'}</td>
                                        <td className="font-semibold">Join Date</td>
                                        <td>____________________</td>
                                    </tr>
                                    
                                    {/* Baris 4: Employment Status */}
                                    <tr>
                                        <td className="font-semibold">Employment Status</td>
                                        <td colSpan="3">{candidate.employmentStatus === 'Contract' ? 'Contract for 12 months' : 'Permanent with 3 months probation'}</td>
                                    </tr>
                                    
                                    {/* Baris Keuangan */}
                                    <tr>
                                        <td className="font-semibold">Basic Salary</td>
                                        <td colSpan="3"><strong>{formatRupiah(proposedSalary.basic).replace('Rp\xa0', 'Rp. ')}</strong>,- per month (net)</td>
                                    </tr>
                                    
                                    {/* Variable Allowances Header */}
                                    {(proposedSalary.incentive > 0 || proposedSalary.specialist > 0 || proposedSalary.meal > 0 || proposedSalary.other > 0) && (
                                        <tr>
                                            <td className="font-semibold italic" colSpan="4">Variable Allowance:</td>
                                        </tr>
                                    )}
                                    
                                    {proposedSalary.incentive > 0 && (
                                        <tr>
                                            <td className="pl-4">Incentive Khusus (IK)</td>
                                            <td colSpan="3">
                                                {formatRupiah(proposedSalary.incentive).replace('Rp\xa0', 'Rp. ')} ,- average per month (net)<br/>
                                                <div className="text-[7pt] mt-0.5 leading-[1.05] text-justify">
                                                    Payment in advances and paid every quarter with scheme Jan (30%), Apr (20%), Jul (30%) and Oct (20%) from total IK Annually. 
                                                    Prorated calculation if employee join to the company is not full month (join date &gt; 1) and will be return to the company if over payment calculation than should be employee receive if employee resign with any reason.
                                                </div>
                                            </td>
                                        </tr>
                                    )}
                                    {proposedSalary.specialist > 0 && (
                                        <tr>
                                            <td className="pl-4">Tunjangan Specialist</td>
                                            <td colSpan="3">{formatRupiah(proposedSalary.specialist).replace('Rp\xa0', 'Rp. ')} ,- per month (net)</td>
                                        </tr>
                                    )}
                                    {proposedSalary.meal > 0 && (
                                        <tr>
                                            <td className="pl-4">Tunjangan Meal</td>
                                            <td colSpan="3">{formatRupiah(proposedSalary.meal).replace('Rp\xa0', 'Rp. ')} ,- per month (net)</td>
                                        </tr>
                                    )}
                                    {proposedSalary.other > 0 && (
                                        <tr>
                                            <td className="pl-4">Tunjangan Other</td>
                                            <td colSpan="3">{formatRupiah(proposedSalary.other).replace('Rp\xa0', 'Rp. ')} ,- per month (net)</td>
                                        </tr>
                                    )}
                                    <tr>
                                        <td className="pl-4">BPJS Ketenagakerjaan<br/>JHT Subsidy (2%)</td>
                                        <td colSpan="3">{formatRupiah(proposedSalary.basic * 0.02).replace('Rp\xa0', 'Rp. ')} ,- per month (net) will be paid to BPJS Ketenagakerjaan/Jamsostek</td>
                                    </tr>
                                    
                                    {/* Total Gaji */}
                                    <tr>
                                        <td className="font-bold bg-slate-100">Total</td>
                                        <td className="font-bold bg-slate-100" colSpan="3">
                                            {formatRupiah(proposedSalary.basic + proposedSalary.incentive + proposedSalary.specialist + proposedSalary.meal + proposedSalary.other + (proposedSalary.basic * 0.02)).replace('Rp\xa0', 'Rp. ')} ,- average per month (net)
                                        </td>
                                    </tr>
                                    
                                    {/* Deductions */}
                                    <tr>
                                        <td className="font-semibold italic" colSpan="4">Deduction:</td>
                                    </tr>
                                    <tr>
                                        <td className="pl-4">BPJS Kesehatan</td>
                                        <td colSpan="3">
                                            Employee's contribution:<br/>
                                            <span className="text-[7pt]">1% from basic salary-cap 12.000.000,-per month (net) /according to government (BPJS Kesehatan) regulation</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="pl-4">BPJS Ketenagakerjaan -<br/>Jaminan Pensiun</td>
                                        <td colSpan="3">
                                            Employee's contribution:<br/>
                                            <span className="text-[7pt]">1% from basic salary-cap 10.547.400,-per month (net)/according to government (BPJS Ketenagakerjaan) regulation</span>
                                        </td>
                                    </tr>
                                    
                                    {/* Benefits Checked Dynamic */}
                                    {selectedBenefits.length > 0 && (
                                    <tr>
                                        <td className="font-semibold">Benefits &amp; Facilities</td>
                                        <td colSpan="3">
                                            The Company will provide the following approved benefits &amp; facilities:
                                            <ul className="list-disc pl-3 mt-0.5 space-y-0 text-[7pt] benefits-cols">
                                                {selectedBenefits.map((b, i) => (
                                                    <li key={i}>{b}</li>
                                                ))}
                                            </ul>
                                        </td>
                                    </tr>
                                    )}

                                    {/* Medical Hardcoded Table (If Applicable) */}
                                    {selectedBenefits.includes("Private Medical Insurance (Inpatient)") && (
                                    <tr>
                                        <td className="font-semibold">Medical Detail</td>
                                        <td colSpan="3">
                                            The Company will cover the Employee Medical facility according to the Company's policy, with the following details:
                                            <table className="w-full mt-0.5 text-[7pt]">
                                                <tbody>
                                                    <tr><td className="w-[45%] py-0">Outpatient-Annual Limit</td><td className="w-[5%] py-0">:</td><td className="py-0">Rp. 18.000.000,-/year (employee &amp; dependents)</td></tr>
                                                    <tr><td className="py-0">Medical Room & Board</td><td className="py-0">:</td><td className="py-0">Rp. 1.350.000,-/day (employee &amp; dependents)</td></tr>
                                                    <tr><td className="py-0">Frame</td><td className="py-0">:</td><td className="py-0">Rp. 1.300.000,-/two year (employee only)</td></tr>
                                                    <tr><td className="py-0">Lens</td><td className="py-0">:</td><td className="py-0">Rp. 1.300.000,-/year (employee only)</td></tr>
                                                </tbody>
                                            </table>
                                        </td>
                                    </tr>
                                    )}
                                    
                                    {/* Tahunan (Bonus/THR) */}
                                    <tr>
                                        <td className="font-semibold">THR</td>
                                        <td colSpan="3">According to company/ government regulation (Basic Salary + IK)</td>
                                    </tr>
                                    {proposedAnnualVars.isQuarterlyEligible && (
                                    <tr>
                                        <td className="font-semibold">Quarterly Incentive</td>
                                        <td colSpan="3">According to company's performance and regulations, refer to {entity} scheme (Basic Salary)</td>
                                    </tr>
                                    )}
                                    {proposedAnnualVars.isBonusEligible && (
                                    <tr>
                                        <td className="font-semibold">Annual Performance Bonus</td>
                                        <td colSpan="3">According to individual and company performance review and regulations {entity} (Basic Salary + IK)</td>
                                    </tr>
                                    )}

                                    {/* Sign-on Bonus */}
                                    {forfeitsBonus && finalSignOn > 0 && (
                                    <tr>
                                        <td className="font-semibold">Sign-On Bonus</td>
                                        <td colSpan="3">
                                            <strong>{formatRupiah(finalSignOn).replace('Rp\xa0', 'Rp. ')} ,- (net)</strong><br/>
                                            <span className="text-[7pt] leading-[1.05] block mt-0.5">
                                                One-time payment upon joining. Subject to a mandatory retention period of {clawbackMonths} months. Should the employee resign before the completion of {clawbackMonths} months, the sign-on bonus must be returned to the company on a pro-rated basis.
                                            </span>
                                        </td>
                                    </tr>
                                    )}

                                    <tr>
                                        <td className="font-semibold">Income Tax</td>
                                        <td colSpan="3">To be borned by company</td>
                                    </tr>
                                </tbody>
                            </table>

                            {/* Tanda Tangan & Tanggal */}
                            <div className="flex justify-between mt-1 text-[8pt]">
                                <div className="text-left w-[35%]">
                                    <p className="mb-0 font-medium">Jakarta, {new Intl.DateTimeFormat('id-ID', {day: '2-digit', month: 'long', year: 'numeric'}).format(new Date())} <br/> Offered by,</p>
                                    <div className="print-signature-space"></div>
                                    <p className="font-bold underline mb-0 leading-none">Hermawan</p>
                                    <p className="leading-none mt-0.5">CHRO</p>
                                </div>
                                <div className="text-left w-[35%]">
                                    <p className="mb-0 text-transparent">Date Hidden <br/> <span className="text-black">Accepted by,</span></p>
                                    <div className="print-signature-space"></div>
                                    <p className="font-bold underline mb-0 leading-none">{candidate.name || '_________________________________'}</p>
                                </div>
                            </div>

                            {/* Disclaimer Footer */}
                            <div className="mt-1 pt-1 border-t border-slate-300 text-[6.5pt]">
                                <p className="font-bold mb-0">Disclaimer: This Offering Letter will be cancelled by the law if in the future we find that:</p>
                                <ol className="list-decimal pl-4 space-y-0 mt-0">
                                    <li>The employee supporting data is not completed or not in accordance with the fact.</li>
                                    <li>BPJS membership is not valid.</li>
                                    <li>Tax ID (NPWP) is not valid.</li>
                                    <li>Fail in the medical test (should the Company conduct the medical test prior employment).</li>
                                </ol>
                            </div>
                            
                        </div>
                        {/* AKHIR OFFERING LETTER */}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
