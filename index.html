<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompensatePro - Total Rewards Calculator</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        @media print {
            body { background-color: white; font-size: 8.5pt; color: #0f172a; line-height: 1.3 !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-shadow-none { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
            .print-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 0.5rem !important; }
            .print-col-span-2 { grid-column: span 2 !important; }
            .print-bg-blue { background-color: #f0f9ff !important; border: 1px solid #bae6fd !important; }
            
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .max-w-6xl { max-width: 100% !important; margin: 0 !important; }
            
            .space-y-6 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem !important; }
            .p-6, .p-5, .p-4 { padding: 0.4rem !important; }
            .mb-6, .mb-5, .mb-4, .mb-3 { margin-bottom: 0.25rem !important; }
            .mt-8, .mt-6, .mt-5, .mt-4 { margin-top: 0.25rem !important; }
            .pb-4, .pb-3, .pb-2 { padding-bottom: 0.2rem !important; }
            .pt-4, .pt-3, .pt-2 { padding-top: 0.2rem !important; }
            .gap-8, .gap-6, .gap-5, .gap-4 { gap: 0.4rem !important; }
            
            input, select { 
                border: none !important; background: transparent !important; 
                box-shadow: none !important; padding: 0 !important; 
                font-size: 8.5pt !important; font-weight: bold !important; 
                color: #0f172a !important; height: auto !important; margin: 0 !important;
            }
            
            .text-3xl { font-size: 13pt !important; line-height: 1.1 !important; }
            .text-2xl { font-size: 11pt !important; line-height: 1.1 !important; }
            /* =========================================
               PRINT MODE TOGGLES (PROPOSAL VS OFFERING)
               ========================================= */
            body.print-proposal .print-offer-only { display: none !important; }
            body.print-proposal .hide-on-print-proposal { display: none !important; }

            body.print-offer .print-proposal-only { display: none !important; }
            body.print-offer .hide-on-print-offer { display: none !important; }

            /* Aturan Khusus Kompresi Ekstrem 1 Halaman untuk Offering Letter */
            body.print-offer * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body.print-offer .offer-table { border-collapse: collapse; width: 100%; font-size: 8pt !important; margin-bottom: 0.2rem !important; }
            body.print-offer .offer-table td { border: 1px solid black !important; padding: 0.15rem 0.25rem !important; vertical-align: top; }
            body.print-offer p, body.print-offer li { line-height: 1.2 !important; margin-bottom: 0.1rem !important; font-size: 8pt !important; }
            
            body.print-offer h1 { font-size: 11pt !important; margin-bottom: 0.2rem !important; margin-top: 0 !important; }
            body.print-offer img { max-height: 45px !important; margin-top: 0 !important; } /* Logo kembali proporsional */
            
            /* Pembelahan Kolom Benefit (Kiri-Kanan) */
            body.print-offer .benefits-cols { columns: 2; column-gap: 1rem; }
            body.print-offer .benefits-cols li { break-inside: avoid-column; page-break-inside: avoid; margin-bottom: 0 !important; }
            
            /* Ruang kosong Tanda Tangan dilegakan (Ditambah 1 spasi ke bawah) */
            body.print-offer .print-signature-space { height: 60px !important; margin: 0 !important; }
            
            /* Margin kertas ekstrem agar muat 1 halaman (Setengah Sentimeter) */
            @page { margin: 0.5cm; size: A4 portrait; }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const generateLevels = () => {
            const levels = {};
            let baseMin = 4000000;
            
            for(let i=1; i<=7; i++) {
                let mid = baseMin * 1.25;
                let max = baseMin * 1.5;
                let annualTarget = mid * 14; 
                levels[`Level ${i}`] = { min: baseMin, mid: mid, max: max, annualTarget: annualTarget };
                baseMin += 1500000;
            }
            for(let i=8; i<=14; i++) {
                let midA = baseMin * 1.25;
                levels[`Level ${i}A`] = { min: baseMin, mid: midA, max: baseMin * 1.5, annualTarget: midA * 14.5 };
                baseMin += 2500000;
                
                let midB = baseMin * 1.25;
                levels[`Level ${i}B`] = { min: baseMin, mid: midB, max: baseMin * 1.5, annualTarget: midB * 14.5 };
                baseMin += 3000000;
            }
            return levels;
        };
        const INITIAL_SS_DB = generateLevels();

        const INITIAL_PEERS_DB = [
            { id: 1, grade: 'Level 8A', name: 'Anonymous Peer 1', basic: 21500000, incentive: 1500000, meal: 1000000, other: 500000, specialist: 0 },
            { id: 2, grade: 'Level 8A', name: 'Anonymous Peer 2', basic: 23000000, incentive: 2000000, meal: 1000000, other: 1000000, specialist: 1000000 },
            { id: 3, grade: 'Level 5', name: 'Anonymous Peer 1', basic: 10500000, incentive: 0, meal: 500000, other: 0, specialist: 0 }
        ];

        const getInitialBenefitsDB = () => {
            const db = {};
            const levels = Object.keys(INITIAL_SS_DB);
            levels.forEach(lvl => {
                const numMatch = lvl.match(/\d+/);
                const levelNum = numMatch ? parseInt(numMatch[0]) : 1;
                
                let ben = [
                    "BPJS Kesehatan (Kelas 1)",
                    "BPJS Ketenagakerjaan (JHT, JP, JKK, JKM)",
                    "Annual Leave (12 Days/Year)"
                ];
                if (levelNum >= 4) ben.push("Private Medical Insurance (Inpatient)");
                if (levelNum >= 8) ben.push("Private Medical Insurance (Outpatient)", "Laptop & Communication Allowance");
                if (levelNum >= 11) ben.push("Car Allowance / Facility");
                
                db[lvl] = ben;
            });
            return db;
        };
        const INITIAL_BENEFITS_DB = getInitialBenefitsDB();

        const formatRupiah = (number) => {
            if (isNaN(number) || number === null || number === undefined) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', { 
                style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 
            }).format(number);
        };

        const parseRupiah = (string) => {
            if (!string) return 0;
            const numberString = string.toString().replace(/[^0-9]/g, '');
            return parseInt(numberString, 10) || 0;
        };

        const CurrencyInput = ({ label, value, onChange, type, field, tooltip, emphasis = false }) => {
            const displayValue = value === 0 ? '' : formatRupiah(value).replace('Rp', '').trim();
            const bgClass = emphasis ? 'bg-blue-50 border-blue-300' : 'bg-white border-slate-300';
            
            return (
                <div className="mb-4">
                    <label className="block text-sm font-semibold text-slate-700 mb-1 flex items-center justify-between">
                        <span>{label} {tooltip && <span className="text-slate-400 text-[11px] font-normal italic ml-1">({tooltip})</span>}</span>
                    </label>
                    <div className="relative group">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span className={`font-medium transition-colors ${emphasis ? 'text-blue-500' : 'text-slate-400 group-focus-within:text-blue-500'}`}>Rp</span>
                        </div>
                        <input
                            type="text"
                            className={`w-full pl-10 pr-3 py-2.5 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-right font-bold text-slate-800 shadow-sm border ${bgClass}`}
                            value={displayValue}
                            onChange={(e) => onChange(type, field, e.target.value)}
                            placeholder="0"
                        />
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = React.useState('main');
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [showLogin, setShowLogin] = React.useState(false);
            const [loginForm, setLoginForm] = React.useState({ user: '', pass: '', error: '' });
            const [isLoading, setIsLoading] = React.useState(true);
            const [isRefreshing, setIsRefreshing] = React.useState(false);
            
            const [entity, setEntity] = React.useState('ABL');
            const LOGOS = {
                ABL: 'https://i.ibb.co.com/whhwgwXS/ABL.jpg',
                DCA: 'https://i.ibb.co.com/bgFmRDGr/DCA.jpg',
                ABC: 'https://i.ibb.co.com/9mtkzyvC/ABC.jpg'
            };

            const ENTITY_NAMES = {
                ABL: 'PT Asian Bulk Logistics',
                DCA: 'PT Dian Ciptamas Agung',
                ABC: 'PT ABC'
            };

            const [dbSS, setDbSS] = React.useState(INITIAL_SS_DB);
            const [dbPeers, setDbPeers] = React.useState(INITIAL_PEERS_DB);
            const [dbBenefits, setDbBenefits] = React.useState(INITIAL_BENEFITS_DB);
            
            const [candidate, setCandidate] = React.useState({ name: '', nickname: '', position: '', department: '', grade: 'Level 8A', expectedBasic: 0, pointOfHire: 'Jakarta', employmentStatus: 'Permanent' });
            const [currentSalary, setCurrentSalary] = React.useState({ basic: 0, incentive: 0, meal: 0, other: 0, specialist: 0 });
            const [proposedSalary, setProposedSalary] = React.useState({ basic: 0, incentive: 0, meal: 0, other: 0, specialist: 0 });
            const [selectedBenefits, setSelectedBenefits] = React.useState([]);
            
            const [currentAnnualVars, setCurrentAnnualVars] = React.useState({ thrMultiplier: 1, actualQuarterly: 0, actualBonus: 0 });
            const [proposedAnnualVars, setProposedAnnualVars] = React.useState({ thrMultiplier: 1, quarterlyMultiplier: 0, bonusMultiplier: 0, isQuarterlyEligible: true, isBonusEligible: true });
            
            const [forfeitsBonus, setForfeitsBonus] = React.useState(false);
            const [unvestedAmount, setUnvestedAmount] = React.useState(0);
            const [finalSignOn, setFinalSignOn] = React.useState(0);
            const [clawbackMonths, setClawbackMonths] = React.useState(12);

            const [showProrataCalc, setShowProrataCalc] = React.useState(false);
            const [prorataInputs, setProrataInputs] = React.useState({ targetBonus: 0, months: 0 });

            const fetchDataFromGoogle = (showRefreshIcon = false) => {
                if (showRefreshIcon) setIsRefreshing(true);
                
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((data) => {
                            if (data.ss2026 && data.ss2026.length > 0) {
                                const formattedSS = {};
                                data.ss2026.forEach(row => {
                                    let g = String(row.Grade || '').trim();
                                    if(g && !g.toLowerCase().startsWith('level')) g = `Level ${g}`;
                                    formattedSS[g] = { 
                                        min: parseRupiah(row.Min), 
                                        mid: parseRupiah(row.Mid), 
                                        max: parseRupiah(row.Max), 
                                        annualTarget: parseRupiah(row.AnnualTarget) 
                                    };
                                });
                                setDbSS(formattedSS);
                            }
                            
                            if (data.peers && data.peers.length > 0) {
                                const formattedPeers = data.peers.map((p, i) => {
                                    let g = String(p.Grade || '').trim();
                                    if(g && !g.toLowerCase().startsWith('level')) g = `Level ${g}`;
                                    
                                    return {
                                        id: p.ID || p.id || Date.now() + i,
                                        grade: g || 'Level 1',
                                        name: p.Name || 'Anonymous Peer',
                                        basic: parseRupiah(p.Basic),
                                        incentive: parseRupiah(p.Incentive),
                                        meal: parseRupiah(p.Meal),
                                        other: parseRupiah(p.Other),
                                        specialist: parseRupiah(p.Specialist)
                                    };
                                });
                                setDbPeers(formattedPeers);
                            }
                            
                            if (data.benefits && data.benefits.length > 0) {
                                const formattedBenefits = {};
                                data.benefits.forEach(row => {
                                    let g = String(row.Grade || '').trim();
                                    if(g && !g.toLowerCase().startsWith('level')) g = `Level ${g}`;
                                    if(!formattedBenefits[g]) formattedBenefits[g] = [];
                                    if(row.BenefitItem) formattedBenefits[g].push(row.BenefitItem);
                                });
                                setDbBenefits(formattedBenefits);
                            }
                            
                            setIsLoading(false);
                            if (showRefreshIcon) setIsRefreshing(false);
                        })
                        .withFailureHandler(err => { 
                            console.error("Gagal mengambil data", err); 
                            setIsLoading(false);
                            if (showRefreshIcon) setIsRefreshing(false);
                        })
                        .getInitialData();
                } else {
                    setTimeout(() => {
                        setIsLoading(false);
                        if (showRefreshIcon) setIsRefreshing(false);
                    }, 800); 
                }
            };

            React.useEffect(() => { fetchDataFromGoogle(false); }, []);
            React.useEffect(() => { setSelectedBenefits(dbBenefits[candidate.grade] || []); }, [candidate.grade, dbBenefits]);

            const totalCurrentMonthly = currentSalary.basic + currentSalary.incentive + currentSalary.meal + currentSalary.other + currentSalary.specialist;
            const totalProposedMonthly = proposedSalary.basic + proposedSalary.incentive + proposedSalary.meal + proposedSalary.other + proposedSalary.specialist;
            
            const annualCurrent = (totalCurrentMonthly * 12) + 
                                  (currentSalary.basic * currentAnnualVars.thrMultiplier) + 
                                  currentAnnualVars.actualQuarterly + 
                                  currentAnnualVars.actualBonus;

            const annualProposed = (totalProposedMonthly * 12) + 
                                   ((proposedSalary.basic + proposedSalary.incentive) * proposedAnnualVars.thrMultiplier) + 
                                   (proposedAnnualVars.quarterlyMultiplier * proposedSalary.basic) + 
                                   (proposedAnnualVars.bonusMultiplier * (proposedSalary.basic + proposedSalary.incentive));

            const currentStructure = dbSS[candidate.grade] || { min: 0, mid: 0, max: 0, annualTarget: 0 };
            const proposedFixed = proposedSalary.basic + proposedSalary.incentive;
            
            const compaRatio = currentStructure.mid > 0 ? ((proposedFixed / currentStructure.mid) * 100).toFixed(1) : 0;
            const comp3Ratio = currentStructure.annualTarget > 0 ? ((annualProposed / currentStructure.annualTarget) * 100).toFixed(1) : 0;
            
            const increaseAmountMonthly = totalProposedMonthly - totalCurrentMonthly;
            const increasePercentMonthly = totalCurrentMonthly > 0 ? ((increaseAmountMonthly / totalCurrentMonthly) * 100).toFixed(1) : 0;

            const increaseAmountAnnual = annualProposed - annualCurrent;
            const increasePercentAnnual = annualCurrent > 0 ? ((increaseAmountAnnual / annualCurrent) * 100).toFixed(1) : 0;

            const gradePeers = dbPeers.filter(p => p.grade === candidate.grade);
            let displayedPeers = [];
            
            if (gradePeers.length > 4) {
                let sorted = [...gradePeers].sort((a, b) => (a.basic + a.incentive) - (b.basic + b.incentive));
                let lowest = { ...sorted[0], tag: 'Lowest', tagColor: 'text-amber-700 bg-amber-100 border-amber-300' };
                let highest = { ...sorted[sorted.length - 1], tag: 'Highest', tagColor: 'text-emerald-700 bg-emerald-100 border-emerald-300' };
                
                let remaining = sorted.slice(1, -1);
                remaining.sort((a, b) => Math.abs((a.basic + a.incentive) - proposedFixed) - Math.abs((b.basic + b.incentive) - proposedFixed));
                let closest1 = { ...remaining[0], tag: 'Closest Match', tagColor: 'text-blue-700 bg-blue-100 border-blue-300' };
                let closest2 = { ...remaining[1], tag: 'Closest Match', tagColor: 'text-blue-700 bg-blue-100 border-blue-300' };
                
                displayedPeers = [highest, closest1, closest2, lowest].sort((a, b) => (b.basic + b.incentive) - (a.basic + a.incentive));
            } else {
                displayedPeers = [...gradePeers].sort((a, b) => (b.basic + b.incentive) - (a.basic + a.incentive));
            }

            const handleSalaryChange = (type, field, value) => {
                const numValue = parseRupiah(value);
                if (type === 'current') setCurrentSalary(prev => ({ ...prev, [field]: numValue }));
                else setProposedSalary(prev => ({ ...prev, [field]: numValue }));
            };

            const handlePrintProposal = () => { 
                document.body.classList.remove('print-offer');
                document.body.classList.add('print-proposal');
                window.print(); 
            };

            const handlePrintOffer = () => { 
                document.body.classList.remove('print-proposal');
                document.body.classList.add('print-offer');
                window.print(); 
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginForm.user === 'admin' && loginForm.pass === 'admin1001') {
                    setIsAdmin(true); setShowLogin(false); setView('admin-ss'); setLoginForm({ user: '', pass: '', error: '' });
                } else setLoginForm({ ...loginForm, error: 'Invalid Username or Password' });
            };

            const getRecommendation = () => {
                const min = currentStructure.min;
                const max = currentStructure.max;
                const currentFixed = currentSalary.basic + currentSalary.incentive;
                const expected = candidate.expectedBasic; 
                
                const peerAvgFixed = gradePeers.length > 0 
                    ? gradePeers.reduce((sum, p) => sum + (p.basic + p.incentive), 0) / gradePeers.length 
                    : 0;
                
                let recFixed = 0;
                let reasons = [];
                
                if (currentFixed > 0) {
                    recFixed = currentFixed * 1.20;
                    reasons.push(`Baseline: 20% increase from Current Fixed (${formatRupiah(recFixed)}).`);
                } else if (expected > 0) {
                    recFixed = expected;
                    reasons.push(`Baseline: Set to Expectation.`);
                } else {
                    recFixed = currentStructure.mid;
                    reasons.push(`Baseline: Defaulted to SS Midpoint.`);
                }

                if (expected > 0 && currentFixed > 0) {
                    if (expected <= currentFixed * 1.30) {
                        recFixed = expected;
                        reasons.push(`Adjusted to Expectation (${formatRupiah(expected)}) (safe < 30% jump limit).`);
                    } else {
                        recFixed = currentFixed * 1.30;
                        reasons.push(`Cap: Expectation limited to max 30% jump (${formatRupiah(recFixed)}).`);
                    }
                }

                if (peerAvgFixed > 0 && recFixed > peerAvgFixed * 1.15) {
                    recFixed = peerAvgFixed * 1.15;
                    reasons.push(`Equity Cap: Capped at 15% above Peer Average (${formatRupiah(peerAvgFixed)}).`);
                }

                if (recFixed < min) { recFixed = min; reasons.push(`SS Limit: Raised to Grade Minimum (${formatRupiah(min)}).`); }
                if (recFixed > max) { recFixed = max; reasons.push(`SS Limit: Capped at Grade Maximum (${formatRupiah(max)}).`); }
                
                recFixed = Math.round(recFixed / 100000) * 100000;
                if(reasons.length === 1) reasons.push("All structure checks passed normally.");

                return { totalFixed: recFixed, reasons };
            };
            const recommendation = getRecommendation();

            const applySplitRecommendation = () => {
                const recTotal = recommendation.totalFixed;
                const newBasic = Math.round((recTotal * 0.7) / 1000) * 1000;
                const newIncentive = recTotal - newBasic; 
                setProposedSalary(prev => ({...prev, basic: newBasic, incentive: newIncentive}));
            };

            const renderLoginModal = () => (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
                        <div className="bg-slate-900 p-6 text-center relative">
                            <button onClick={() => setShowLogin(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fas fa-times text-xl"></i></button>
                            <i className="fas fa-lock text-4xl text-blue-400 mb-3"></i>
                            <h2 className="text-2xl font-black text-white">Admin Access</h2>
                        </div>
                        <form onSubmit={handleLogin} className="p-6 space-y-4">
                            {loginForm.error && <div className="bg-rose-50 text-rose-600 p-3 rounded-lg text-sm font-bold text-center border border-rose-200">{loginForm.error}</div>}
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">Username</label>
                                <input type="text" className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" value={loginForm.user} onChange={e => setLoginForm({...loginForm, user: e.target.value})} autoFocus required />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">Password</label>
                                <input type="password" className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" value={loginForm.pass} onChange={e => setLoginForm({...loginForm, pass: e.target.value})} required />
                            </div>
                            <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition mt-2">Login Securely</button>
                        </form>
                    </div>
                </div>
            );

            if (view.startsWith('admin')) return (
                <div className="min-h-screen p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-900 p-6 flex justify-between items-center text-white">
                            <div>
                                <h1 className="text-2xl font-black flex items-center"><i className="fas fa-server text-blue-400 mr-3"></i>HR Database Panel</h1>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setView('main')} className="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl font-bold transition border border-white/20">Back to App</button>
                                <button onClick={() => {setIsAdmin(false); setView('main');}} className="bg-rose-500 hover:bg-rose-600 px-4 py-2 rounded-xl font-bold transition shadow-lg">Logout</button>
                            </div>
                        </div>
                        <div className="flex border-b border-slate-200 bg-slate-50">
                            <button onClick={() => setView('admin-ss')} className={`flex-1 py-4 font-bold text-sm text-center ${view === 'admin-ss' ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'text-slate-500'}`}>SS 2026 Data</button>
                            <button onClick={() => setView('admin-peers')} className={`flex-1 py-4 font-bold text-sm text-center ${view === 'admin-peers' ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'text-slate-500'}`}>Anonymous Peers</button>
                            <button onClick={() => setView('admin-benefits')} className={`flex-1 py-4 font-bold text-sm text-center ${view === 'admin-benefits' ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'text-slate-500'}`}>Benefit Catalogs</button>
                        </div>
                    </div>
                    
                    {view === 'admin-ss' && (
                        <div className="bg-white rounded-2xl p-6 border border-slate-200">
                            <h2 className="text-lg font-bold mb-4">Edit SS 2026</h2>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead className="bg-slate-50">
                                        <tr className="text-xs uppercase">
                                            <th className="p-4">Grade</th>
                                            <th className="p-4 text-right">Min</th>
                                            <th className="p-4 text-right">Mid</th>
                                            <th className="p-4 text-right">Max</th>
                                            <th className="p-4 text-right">Target (Comp 3)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {Object.keys(dbSS).map(level => (
                                            <tr key={level} className="border-t border-slate-100 hover:bg-slate-50">
                                                <td className="p-3 font-bold">{level}</td>
                                                <td className="p-3">
                                                    <input 
                                                        className="w-full text-right bg-transparent focus:bg-white rounded p-1 border" 
                                                        value={formatRupiah(dbSS[level].min).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbSS({...dbSS, [level]: {...dbSS[level], min: parseRupiah(e.target.value)}})} 
                                                    />
                                                </td>
                                                <td className="p-3">
                                                    <input 
                                                        className="w-full text-right bg-transparent focus:bg-white rounded p-1 border font-bold text-blue-700" 
                                                        value={formatRupiah(dbSS[level].mid).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbSS({...dbSS, [level]: {...dbSS[level], mid: parseRupiah(e.target.value)}})} 
                                                    />
                                                </td>
                                                <td className="p-3">
                                                    <input 
                                                        className="w-full text-right bg-transparent focus:bg-white rounded p-1 border" 
                                                        value={formatRupiah(dbSS[level].max).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbSS({...dbSS, [level]: {...dbSS[level], max: parseRupiah(e.target.value)}})} 
                                                    />
                                                </td>
                                                <td className="p-3">
                                                    <input 
                                                        className="w-full text-right bg-transparent focus:bg-white rounded p-1 border font-bold text-emerald-600" 
                                                        value={formatRupiah(dbSS[level].annualTarget).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbSS({...dbSS, [level]: {...dbSS[level], annualTarget: parseRupiah(e.target.value)}})} 
                                                    />
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    
                    {view === 'admin-peers' && (
                        <div className="bg-white rounded-2xl p-6 border border-slate-200">
                             <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-slate-800">Anonymous Peers Directory</h2>
                                <button 
                                    onClick={() => setDbPeers([{ id: Date.now(), grade: 'Level 1', name: `Peer ${Date.now().toString().slice(-4)}`, basic: 0, incentive: 0, meal: 0, other: 0, specialist: 0 }, ...dbPeers])} 
                                    className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm"
                                >
                                    Add New Peer
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse whitespace-nowrap">
                                    <thead className="bg-slate-50">
                                        <tr className="text-xs uppercase">
                                            <th className="p-4">Grade</th>
                                            <th className="p-4">ID</th>
                                            <th className="p-4 text-right">Basic</th>
                                            <th className="p-4 text-right">Incentive</th>
                                            <th className="p-4 text-right">Meal & Other & Spec</th>
                                            <th className="p-4 text-center">Act</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {dbPeers.map(peer => (
                                            <tr key={peer.id} className="hover:bg-slate-50">
                                                <td className="p-3">
                                                    <select 
                                                        className="bg-transparent border border-slate-200 rounded p-1" 
                                                        value={peer.grade} 
                                                        onChange={(e) => setDbPeers(dbPeers.map(p => p.id === peer.id ? {...p, grade: e.target.value} : p))}
                                                    >
                                                        {Object.keys(dbSS).map(g => <option key={g} value={g}>{g}</option>)}
                                                    </select>
                                                </td>
                                                <td className="p-3">
                                                    <input 
                                                        type="text" 
                                                        className="bg-transparent rounded p-1 border w-full" 
                                                        value={peer.name} 
                                                        onChange={(e) => setDbPeers(dbPeers.map(p => p.id === peer.id ? {...p, name: e.target.value} : p))} 
                                                    />
                                                </td>
                                                <td className="p-3">
                                                    <input 
                                                        type="text" 
                                                        className="w-full text-right bg-transparent rounded p-1 border font-semibold" 
                                                        value={formatRupiah(peer.basic).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbPeers(dbPeers.map(p => p.id === peer.id ? {...p, basic: parseRupiah(e.target.value)} : p))} 
                                                    />
                                                </td>
                                                <td className="p-3">
                                                    <input 
                                                        type="text" 
                                                        className="w-full text-right bg-transparent rounded p-1 border" 
                                                        value={formatRupiah(peer.incentive).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbPeers(dbPeers.map(p => p.id === peer.id ? {...p, incentive: parseRupiah(e.target.value)} : p))} 
                                                    />
                                                </td>
                                                <td className="p-3 text-right flex gap-1">
                                                    <input 
                                                        type="text" 
                                                        className="w-1/3 text-right bg-transparent border-b p-1 text-xs" 
                                                        placeholder="Meal" 
                                                        value={peer.meal === 0 ? '' : formatRupiah(peer.meal).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbPeers(dbPeers.map(p => p.id === peer.id ? {...p, meal: parseRupiah(e.target.value)} : p))} 
                                                    />
                                                    <input 
                                                        type="text" 
                                                        className="w-1/3 text-right bg-transparent border-b p-1 text-xs" 
                                                        placeholder="Other" 
                                                        value={peer.other === 0 ? '' : formatRupiah(peer.other).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbPeers(dbPeers.map(p => p.id === peer.id ? {...p, other: parseRupiah(e.target.value)} : p))} 
                                                    />
                                                    <input 
                                                        type="text" 
                                                        className="w-1/3 text-right bg-transparent border-b p-1 text-xs" 
                                                        placeholder="Spec" 
                                                        value={peer.specialist === 0 ? '' : formatRupiah(peer.specialist).replace('Rp','').trim()} 
                                                        onChange={(e) => setDbPeers(dbPeers.map(p => p.id === peer.id ? {...p, specialist: parseRupiah(e.target.value)} : p))} 
                                                    />
                                                </td>
                                                <td className="p-3 text-center">
                                                    <button 
                                                        onClick={() => setDbPeers(dbPeers.filter(p => p.id !== peer.id))} 
                                                        className="text-rose-500"
                                                    >
                                                        <i className="fas fa-trash-alt"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    
                    {view === 'admin-benefits' && (
                        <div className="bg-white rounded-2xl p-6 border border-slate-200">
                             <h2 className="text-lg font-bold mb-4">Benefit Catalogs by Grade</h2>
                             <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {Object.keys(dbBenefits).map(grade => (
                                    <div key={grade} className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                        <div className="bg-slate-50 p-3 border-b border-slate-200 flex justify-between items-center">
                                            <h3 className="font-bold">{grade}</h3>
                                        </div>
                                        <div className="p-3 h-40 overflow-y-auto">
                                            <ul className="space-y-2">
                                                {dbBenefits[grade].map((ben, idx) => (
                                                    <li key={idx} className="flex justify-between items-start text-sm bg-white p-2 rounded border border-slate-100">
                                                        <span>{ben}</span>
                                                        <button 
                                                            onClick={() => setDbBenefits({...dbBenefits, [grade]: dbBenefits[grade].filter((_, i) => i !== idx)})} 
                                                            className="text-rose-500 ml-2"
                                                        >
                                                            <i className="fas fa-times"></i>
                                                        </button>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                        <div className="p-2 bg-slate-50 flex gap-2 border-t">
                                            <input 
                                                type="text" 
                                                id={`new-ben-${grade}`} 
                                                placeholder="Add benefit..." 
                                                className="flex-1 text-sm p-1.5 border rounded" 
                                                onKeyDown={(e) => { 
                                                    if(e.key === 'Enter' && e.target.value.trim()) { 
                                                        setDbBenefits({...dbBenefits, [grade]: [...dbBenefits[grade], e.target.value.trim()]}); 
                                                        e.target.value = ''; 
                                                    } 
                                                }} 
                                            />
                                            <button 
                                                onClick={() => { 
                                                    const input = document.getElementById(`new-ben-${grade}`); 
                                                    if(input.value.trim()) { 
                                                        setDbBenefits({...dbBenefits, [grade]: [...dbBenefits[grade], input.value.trim()]}); 
                                                        input.value = ''; 
                                                    } 
                                                }} 
                                                className="bg-slate-800 text-white px-3 py-1.5 rounded text-sm font-bold"
                                            >
                                                <i className="fas fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );

            if (isLoading) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50">
                    <div className="text-center p-10 bg-white rounded-3xl shadow-xl border border-slate-200">
                        <i className="fas fa-circle-notch fa-spin text-5xl text-blue-600 mb-6"></i>
                        <h2 className="text-2xl font-black text-slate-800">Menghubungkan ke Database...</h2>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
                    {showLogin && renderLoginModal()}
                    
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* WRAPPER HIDE SAAT CETAK OFFERING LETTER */}
                        <div className="hide-on-print-offer space-y-6">

                            {/* Header Area */}
                            <div className="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
                                <div className="flex items-center space-x-4">
                                    <img src="https://i.ibb.co.com/XfW7TmqG/logo-compensatepro-doang.png" alt="CompensatePro Logo" className="h-12 w-auto object-contain" />
                                    <div>
                                        <h1 className="text-3xl font-black text-slate-900 tracking-tight">Compensate<span className="text-cyan-500">Pro</span></h1>
                                        <p className="text-slate-500 text-sm font-semibold tracking-wide">Enterprise Salary Proposal | Smarter. Faster. Better.</p>
                                    </div>
                                </div>
                                <div className="flex gap-2 mt-4 md:mt-0 flex-wrap justify-end">
                                    <button onClick={() => fetchDataFromGoogle(true)} className="px-4 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold rounded-xl transition shadow-sm" title="Sync Data">
                                        <i className={`fas fa-sync-alt ${isRefreshing ? 'fa-spin text-blue-500' : 'text-slate-400'}`}></i>
                                    </button>
                                    <button onClick={() => isAdmin ? setView('admin-ss') : setShowLogin(true)} className="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold rounded-xl transition shadow-sm flex items-center">
                                        <i className="fas fa-cog mr-2 text-slate-400"></i> Admin
                                    </button>
                                    
                                    <div className="flex items-center ml-2 border-l border-slate-200 pl-4 gap-2">
                                        <select value={entity} onChange={(e) => setEntity(e.target.value)} className="px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-slate-700 shadow-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                                            <option value="ABL">PT ABL</option>
                                            <option value="DCA">PT DCA</option>
                                            <option value="ABC">PT ABC</option>
                                        </select>
                                        <button onClick={handlePrintOffer} className="px-5 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-700 hover:to-teal-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/30 transform transition hover:-translate-y-0.5 flex items-center">
                                            <i className="fas fa-file-contract mr-2"></i> Print Offer
                                        </button>
                                        <button onClick={handlePrintProposal} className="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transform transition hover:-translate-y-0.5 flex items-center">
                                            <i className="fas fa-print mr-2"></i> Print Proposal
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Print Header untuk Proposal */}
                            <div className="hidden print:block text-center border-b-2 border-slate-800 pb-4 mb-6 print-proposal-only">
                                <img src="https://i.ibb.co.com/XfW7TmqG/logo-compensatepro-doang.png" alt="Logo" className="h-10 mx-auto mb-3" />
                                <h1 className="text-3xl font-black uppercase tracking-wider text-slate-900">Total Rewards Proposal</h1>
                                <p className="text-slate-600 mt-1 font-medium">Strictly Confidential | Internal Use Only</p>
                            </div>

                        {/* Core Form Area */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 print:grid-cols-3 print:gap-3">
                            {/* Candidate Form */}
                            <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm print-shadow-none p-6 border border-slate-200 border-t-4 border-t-blue-500">
                                <h2 className="text-lg font-bold text-slate-800 mb-5 flex items-center"><i className="fas fa-user-circle text-blue-500 mr-2 text-xl"></i>Candidate Information</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Full Name</label>
                                        <input type="text" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" value={candidate.name} onChange={(e) => setCandidate({...candidate, name: e.target.value})} placeholder="e.g. Budi Santoso" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Nick Name</label>
                                        <input type="text" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" value={candidate.nickname} onChange={(e) => setCandidate({...candidate, nickname: e.target.value})} placeholder="e.g. Budi" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Job Position</label>
                                        <input type="text" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" value={candidate.position} onChange={(e) => setCandidate({...candidate, position: e.target.value})} placeholder="e.g. Senior Manager" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Job Grade</label>
                                        <select className="w-full p-2.5 bg-blue-50 border border-blue-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-700 shadow-sm" value={candidate.grade} onChange={(e) => setCandidate({...candidate, grade: e.target.value})}>
                                            {Object.keys(dbSS).map(grade => <option key={grade} value={grade}>{grade}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Employment Status</label>
                                        <select className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-800" value={candidate.employmentStatus} onChange={(e) => setCandidate({...candidate, employmentStatus: e.target.value})}>
                                            <option value="Permanent">Permanent (3 mo Probation)</option>
                                            <option value="Contract">Contract (12 Months)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Point of Hire</label>
                                        <input type="text" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-800" value={candidate.pointOfHire} onChange={(e) => setCandidate({...candidate, pointOfHire: e.target.value})} placeholder="e.g. Jakarta" />
                                    </div>
                                    <div className="lg:col-span-3">
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Expected Fixed Salary (Basic + Incentive) <span className="text-amber-600 ml-1">(Optional)</span></label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                                <span className="text-slate-400 font-medium">Rp</span>
                                            </div>
                                            <input 
                                                type="text" 
                                                className="w-full pl-10 pr-3 p-2.5 bg-amber-50/50 border border-amber-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none font-bold text-slate-800" 
                                                value={candidate.expectedBasic === 0 ? '' : formatRupiah(candidate.expectedBasic).replace('Rp', '').trim()} 
                                                onChange={(e) => setCandidate({...candidate, expectedBasic: parseRupiah(e.target.value)})} 
                                                placeholder="Ekspektasi Total Fixed Bulanan" 
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* SS 2026 Reference Panel */}
                            <div className="bg-slate-900 rounded-2xl shadow-xl print-shadow-none p-6 text-white relative overflow-hidden border border-slate-800 print:bg-white print:text-black print:border-slate-300">
                                <div className="absolute -right-4 -top-4 opacity-5 no-print">
                                    <i className="fas fa-chart-pie text-9xl"></i>
                                </div>
                                <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-3 print:border-slate-300">
                                    <h2 className="text-lg font-bold text-white print:text-slate-900 flex items-center"><i className="fas fa-crosshairs text-blue-400 mr-2 print:text-blue-600"></i>SS 2026 DB</h2>
                                    <span className="bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full font-bold text-xs border border-blue-500/30 print:border-slate-400 print:text-slate-800">{candidate.grade}</span>
                                </div>
                                <div className="relative z-10 space-y-3">
                                    <div className="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center print:border-slate-200 print:bg-slate-50">
                                        <span className="text-sm text-slate-400">Maximum</span>
                                        <span className="font-bold text-slate-200">{formatRupiah(currentStructure.max)}</span>
                                    </div>
                                    <div className="bg-gradient-to-r from-blue-900 to-cyan-900 p-3 rounded-xl border border-cyan-500/50 flex justify-between items-center shadow-lg my-4 print:shadow-none print:border-blue-300 print:bg-blue-50">
                                        <span className="text-sm font-bold text-cyan-300 print:text-blue-800">Midpoint</span>
                                        <span className="font-black text-white text-lg print:text-blue-900">{formatRupiah(currentStructure.mid)}</span>
                                    </div>
                                    <div className="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center print:border-slate-200 print:bg-slate-50">
                                        <span className="text-sm text-slate-400">Minimum</span>
                                        <span className="font-bold text-slate-200">{formatRupiah(currentStructure.min)}</span>
                                    </div>
                                </div>
                                <div className="mt-4 pt-4 border-t border-slate-700 print:border-slate-300 text-center bg-slate-950 rounded-xl p-3 border border-slate-800 print:bg-white">
                                    <p className="text-xs text-slate-400 uppercase tracking-wider mb-1 font-bold">Annual Target (Comp 3)</p>
                                    <p className="text-emerald-400 font-bold text-xl">{formatRupiah(currentStructure.annualTarget)}</p>
                                </div>
                            </div>
                        </div>

                        {}
                        {/* RECOMMENDATION ENGINE PANEL */}
                        <div className="bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-200 rounded-2xl p-6 shadow-sm no-print print-break-inside-avoid relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-5">
                                <i className="fas fa-robot text-8xl text-indigo-500"></i>
                            </div>
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 relative z-10 border-b border-indigo-100 pb-4">
                                <div>
                                    <h3 className="text-xl font-black text-indigo-900 tracking-tight"><i className="fas fa-wand-magic-sparkles mr-2 text-indigo-500"></i>AI Recommendation</h3>
                                    <p className="text-sm text-indigo-600 font-medium mt-1">Calculating ideal Fixed Pay based on SS 2026, Internal Equity & Expectations.</p>
                                </div>
                                <button onClick={applySplitRecommendation} className="mt-4 md:mt-0 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transform transition hover:-translate-y-0.5 flex items-center">
                                    <i className="fas fa-check-double mr-2"></i>Apply to Proposal (Split 70/30)
                                </button>
                            </div>
                            
                            <div className="flex flex-col lg:flex-row gap-6 items-stretch relative z-10">
                                <div className="bg-white p-5 rounded-xl border-2 border-indigo-200 shadow-sm text-center min-w-[280px] flex flex-col justify-center">
                                    <p className="text-sm font-bold text-slate-500 mb-2 uppercase tracking-wide">Recommended Total Fixed</p>
                                    <p className="text-3xl font-black text-indigo-700 tracking-tight">{formatRupiah(recommendation.totalFixed)}</p>
                                    <div className="mt-3 flex justify-center gap-2 text-xs font-bold text-slate-500">
                                        <span className="bg-slate-100 px-2 py-1 rounded border border-slate-200">Basic 70%: {formatRupiah(recommendation.totalFixed * 0.7)}</span>
                                    </div>
                                </div>
                                <div className="flex-1 bg-white/60 p-5 rounded-xl border border-indigo-100">
                                    <p className="text-sm font-bold text-indigo-900 mb-3 uppercase tracking-wider border-b border-indigo-100 pb-2">Calculation Reasoning:</p>
                                    <ul className="space-y-2">
                                        {recommendation.reasons.map((r, i) => (
                                            <li key={i} className="text-sm text-slate-700 flex items-start font-medium">
                                                <i className="fas fa-check text-emerald-500 mt-1 mr-2 text-xs"></i> 
                                                <span dangerouslySetInnerHTML={{__html: r.replace(/(Rp [\d.,]+)/g, '<strong class="text-indigo-700">$1</strong>')}} />
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>

                            {/* SIGN-ON BONUS ENGINE */}

                                        <div className="flex justify-between items-center mb-1">

                                            <span className="font-black text-slate-800 text-xl">{formatRupiah(totalCurrentMonthly)}</span>
                                        </div>
                                    </div>
                                </div>

                                        <CurrencyInput label="Other Allowance" tooltip="Monthly" value={proposedSalary.other} onChange={handleSalaryChange} type="proposed" field="other" />
                                        <CurrencyInput label="Tunjangan Specialist" tooltip="Monthly" value={proposedSalary.specialist} onChange={handleSalaryChange} type="proposed" field="specialist" />

                                        <div className="flex justify-between items-center mb-1">

                                            <span className="font-black text-blue-700 text-2xl">{formatRupiah(totalProposedMonthly)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
